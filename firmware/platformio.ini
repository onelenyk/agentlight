; AgentLight: світлофор статусу AI-агента. ESP32-C3 Super Mini + WS2812 (Adafruit NeoPixel).
; Залити: pio run -t upload      Монітор: pio device monitor
[platformio]
default_envs = c3_supermini

[env:c3_supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^7.0.0
    h2zero/NimBLE-Arduino@^1.4.2
build_flags =
    ; USB-C плати — це вбудований USB чипа: монітор порту і прошивка через нього
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ; Діоди: два виходи даних (як у meteor-orb), по LED_COUNT діодів на кожному
    -D LED_PIN_A=3
    -D LED_PIN_B=4
    -D LED_COUNT=10
    ; Сенсорна кнопка TTP223: вихід I/O модуля
    -D TOUCH_PIN=1
    ; Bluetooth потрібен лише як сервер для налаштування WiFi
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED

; Тестова прошивка: веселка і сенсор TTP223, без WiFi. Залити: pio run -e touchtest -t upload
[env:touchtest]
extends = env:c3_supermini
build_src_filter = -<*> +<../test_fw/>
lib_deps =
    adafruit/Adafruit NeoPixel@^1.12.0
