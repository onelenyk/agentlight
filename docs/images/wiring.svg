<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 440" width="1560" height="880" role="img" aria-label="Схема: 5V і GND плати йдуть на всі три платки діодів, GPIO4 через резистор 330 Ом на DIN першої, далі DOUT кожної на DIN наступної. Сенсор TTP223: VCC від 3V3, GND від GND, вихід I/O на GPIO1">
<style>
text{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.wire{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.w-5v{stroke:#e5484d}.w-data{stroke:#2fa858}.w-gnd{stroke:#151a22}.w-3v3{stroke:#e0a100}.w-sig{stroke:#3b82f6}
.f-5v{fill:#e5484d}.f-data{fill:#2fa858}.f-gnd{fill:#151a22}.f-sig{fill:#3b82f6}
.pcb{fill:#e9ecf0;stroke:#5d6877;stroke-width:1.5}
.pad{fill:#f6f7f9;stroke:#5d6877;stroke-width:1.5}
.pad.used{stroke:#151a22;stroke-width:2}
.t{fill:#5d6877;font-size:11px}
.t.on{fill:#151a22;font-weight:500}
.t.big{font-size:13px}
</style>
<rect width="780" height="440" fill="#f6f7f9"/>
