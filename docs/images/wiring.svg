<circle class="pcb" cx="285" cy="164" r="34"/><rect class="pad" x="274" y="153" width="22" height="22" rx="3"/><text class="t on big" x="285" y="169" text-anchor="middle">2</text><circle class="pad used" cx="285" cy="138" r="4.5"/><circle class="pad used" cx="285" cy="190" r="4.5"/><circle class="pad used" cx="311" cy="164" r="4.5"/><circle class="pad used" cx="259" cy="164" r="4.5"/><text class="t" x="323" y="180">DIN</text><text class="t" x="247" y="180" text-anchor="end">DOUT</text>
