<circle class="pad used" cx="458" cy="380" r="4.5"/><text class="t on" x="448" y="384" text-anchor="end">I/O</text>
<text class="t" x="400" y="420" text-anchor="middle">сенсор, у стелі розсіювача</text>
<text class="t on" x="530" y="353" text-anchor="middle">3V3 · жовтий</text>
<text class="t on" x="530" y="398" text-anchor="middle">сигнал · синій</text>
<text class="t" x="180" y="304" text-anchor="middle">платки діодів, у кишенях диска</text>
</svg>
