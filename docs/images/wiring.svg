<path class="wire w-sig" d="M464 380 H592 V248 H606"/>
<rect class="pcb" x="330" y="318" width="140" height="84" rx="6"/>
<circle class="pad" cx="378" cy="360" r="30"/><text class="t on" x="378" y="357" text-anchor="middle">TTP223</text><text class="t" x="378" y="372" text-anchor="middle">дотик</text>
<circle class="pad used" cx="458" cy="340" r="4.5"/><text class="t on" x="448" y="344" text-anchor="end">GND</text>
