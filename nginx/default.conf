server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # сторінка одна й маленька — не кешуємо, щоб оновлення було видно відразу
    add_header Cache-Control "no-store" always;

    # усе, чого немає у файлах, — 404 (тут лежить лише сама сторінка налаштування)
    location / {
        try_files $uri $uri/ =404;
    }
}
